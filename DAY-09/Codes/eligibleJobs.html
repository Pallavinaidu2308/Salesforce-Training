<template>
    <lightning-card title="Eligible Jobs">
        <div class="slds-p-around_medium">

            <template for:each={jobs} for:item="job">

                <div key={job.Id} class="slds-box slds-m-bottom_medium">

                    <h2 class="slds-text-heading_medium">
                        {job.Name}
                    </h2>

                    <p>
                        <strong>Company:</strong> {job.Company__c}
                    </p>

                    <p>
                        <strong>Minimum CGPA:</strong> {job.Minimum_CGPA__c}
                    </p>

                    <p>
                        <strong>Closing Date:</strong> {job.Closing_Date__c}
                    </p>

                    <lightning-button
                        label="Apply"
                        variant="brand"
                        data-id={job.Id}
                        onclick={handleApply}>
                    </lightning-button>

                </div>

            </template>

        </div>
    </lightning-card>
</template>
