
<template>
    <lightning-card title="Placement Portal">

        <div class="slds-p-around_medium">

            <h1 style="font-size:24px;font-weight:bold;">
                Welcome to Vishnu Placement Portal
            </h1>

            <br/>

            <p><b>Student Name :</b> {studentName}</p>

            <p><b>Roll Number :</b> {rollNumber}</p>

            <p><b>Department :</b> {department}</p>

            <br/>

            <lightning-button
                label="Show Welcome Message"
                variant="brand"
                onclick={showMessage}>
            </lightning-button>

            <br/><br/>

            <p>{message}</p>

            <br/>

            <p><b>Status :</b> {status}</p>

            <br/>

            <lightning-button
                label="Apply"
                variant="success"
                onclick={applyJob}>
            </lightning-button>

        </div>

    </lightning-card>
</template>
